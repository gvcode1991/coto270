name: Verificar aplicacion

on:
  push:
    branches: [dev, prod, main]
  pull_request:
    branches: [dev, prod, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm run test:server
      - run: pnpm run build:pages
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pruebas-interfaz
          path: test-results
          retention-days: 7
